<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Η σελίδα δεν βρέθηκε | Frigoplus</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <style>
        :root { --primary: #0066cc; --text: #333333; --muted: #666666; --bg: #ffffff; }
        @media (prefers-color-scheme: dark) {
            :root { --primary: #66b3ff; --text: #f5f5f5; --muted: #cccccc; --bg: #1a1a1a; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            text-align: center;
        }
        img { max-width: 150px; height: auto; margin-bottom: 24px; }
        h1 { font-size: 1.75rem; margin-bottom: 8px; }
        p { color: var(--muted); margin-bottom: 24px; }
        a.btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 6px;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
        .phone { display: block; margin-top: 16px; color: var(--primary); }
    </style>
</head>
<body>
    <main>
        <img src="/assets/images/logo.png" alt="Frigoplus" width="150" height="50">

</body>
</html>
